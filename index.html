            useEffect(() => {

            useEffect(() => {

            useEffect(() => {

            useEffect(() => {

            useEffect(() => {
                localStorage.setItem('mem_daily_goal', String(dailyGoal));
                localStorage.setItem('mem_daily_count', String(dailyCount));
                localStorage.setItem('mem_streak', String(streak));

                localStorage.setItem('mem_favorites', JSON.stringify(favoriteIds));
            }, [dailyGoal, dailyCount, streak, lastStudyDate, favoriteIds]);

            useEffect(() => {
                let timer;
                if (activeTab === 'quiz_run' && !showQuizResult && quizSelected === null && quizTimeLeft > 0) {
                    timer = setTimeout(() => { setQuizTimeLeft(prev => prev - 1); }, 1000);
                } else if (activeTab === 'quiz_run' && !showQuizResult && quizSelected === null && quizTimeLeft === 0) {
                    handleQuizAnswer('timeout');
                }
                return () => clearTimeout(timer);
            }, [activeTab, showQuizResult, quizSelected, quizTimeLeft]);

            const saveToStorage = (newTerms, newDecks) => {
                try {
                    localStorage.setItem('medical_terms_db', JSON.stringify(newTerms));
                    if (newDecks) localStorage.setItem('medical_decks_db', JSON.stringify(newDecks));
                } catch (e) { showAlert("Bộ nhớ thiết bị đã đầy, không thể lưu."); }
            };

            const resetData = () => {
                showConfirm("CẢNH BÁO: Bạn có chắc chắn muốn xóa TOÀN BỘ bộ từ, tiến trình học và từ vựng?", () => {
                    localStorage.removeItem('medical_terms_db');

                    localStorage.removeItem('mem_last_study_date');

                    setTerms([]); setDecks([]); setDailyCount(0); setStreak(0); setActiveTab('home'); setDashboardListView(null);
                });
            };

            const todayKey = () => new Date().toISOString().slice(0,10);
            const markStudyDay = () => {
                const today = todayKey();
                if (lastStudyDate === today) return;
                const prev = new Date();
                prev.setDate(prev.getDate()-1);
                const prevKey = prev.toISOString().slice(0,10);
                setStreak(lastStudyDate === prevKey ? streak + 1 : 1);
                setLastStudyDate(today);
            };

            const speakTerm = (term) => {
                if (!('speechSynthesis' in window) || !term) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(term); u.lang = 'en-US'; u.rate = 0.85;
                window.speechSynthesis.speak(u);
            };

            const handleGlobalFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        
                        let allParsedTerms = [];
                        let parsedDecks = [];
                        let deckCounter = 1;
                        let idCounter = 1;

                        const sheetsToProcess = workbook.SheetNames.length > 1 ? workbook.SheetNames.slice(1) : workbook.SheetNames;

                        sheetsToProcess.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" }); 
                            if (jsonData.length === 0) return;

                            let headerRowIndex = -1;
                            let colMap = { term: -1, type: -1, ipa: -1, viet: -1, ex_en: -1, ex_vi: -1 };

                            for (let i = 0; i < Math.min(20, jsonData.length); i++) {
                                const row = jsonData[i];
                                if (!row || !Array.isArray(row)) continue;
                                
                                const filledCells = row.filter(cell => String(cell).trim() !== "");
                                if (filledCells.length < 3) continue;

                                const rowStr = row.map(cell => String(cell).toLowerCase()).join(' | ');
                                
                                if (rowStr.includes('từ vựng') || rowStr.includes('định nghĩa') || rowStr.includes('loại từ')) {
                                    headerRowIndex = i;
                                    row.forEach((cell, idx) => {
                                        const c = String(cell).toLowerCase().trim();
                                        if (c.includes('từ vựng') || c.includes('thuật ngữ') || (c.includes('term') && !c.includes('determine'))) colMap.term = idx;
                                        else if (c.includes('loại từ') || c.includes('part of speech') || c === 'loại') colMap.type = idx;
                                        else if (c.includes('phát âm') || c.includes('ipa')) colMap.ipa = idx;
                                        else if (c.includes('dịch nghĩa ví dụ') || c.includes('dịch ví dụ') || (c.includes('ví dụ') && c.includes('việt'))) colMap.ex_vi = idx;
                                        else if (c.includes('ví dụ tiếng anh') || (c.includes('ví dụ') && (c.includes('anh') || c.includes('en'))) || c.includes('english example')) colMap.ex_en = idx;
                                        else if (c.includes('định nghĩa') || c.includes('tiếng việt') || c.includes('nghĩa') || c.includes('dịch')) colMap.viet = idx;
                                        else if (c.includes('ví dụ')) if (colMap.ex_en === -1) colMap.ex_en = idx;
                                    });
                                    break;
                                }
                            }

                            if (headerRowIndex === -1 || colMap.term === -1) return;

                            let validRows = [];
                            for (let i = headerRowIndex + 1; i < jsonData.length; i++) {
                                const row = jsonData[i];
                                if (!row || row.length === 0) continue;
                                const termVal = String(row[colMap.term] || '').trim();
                                if (!termVal || /^\d+$/.test(termVal) || termVal.toLowerCase() === 'stt' || termVal.toLowerCase().includes("bảng tổng hợp") || termVal.toLowerCase().includes("chuyên ngành")) continue;
                                validRows.push(row);
                            }

                            const chunkSize = 35;
                            const totalParts = Math.ceil(validRows.length / chunkSize);

                            for (let p = 0; p < totalParts; p++) {
                                const chunk = validRows.slice(p * chunkSize, (p + 1) * chunkSize);
                                if (chunk.length === 0) continue;

                                const deckId = `DECK_${String(deckCounter).padStart(2, '0')}`;
                                const deckTopic = totalParts > 1 ? `${sheetName} (Part ${p + 1})` : sheetName;
                                
                                parsedDecks.push({ id: deckId, topic: sheetName, title: deckTopic, count: chunk.length });

                                chunk.forEach(row => {
                                    const termStr = String(row[colMap.term] || '').trim();
                                    const vietStr = colMap.viet !== -1 ? String(row[colMap.viet] || '').trim() : '';

                                    allParsedTerms.push({
                                        id: `MED${String(idCounter).padStart(4, '0')}`,
                                        deckId: deckId, term: termStr,
                                        type: colMap.type !== -1 ? String(row[colMap.type] || '').trim() : '',
                                        ipa: colMap.ipa !== -1 ? String(row[colMap.ipa] || '').trim() : '',
                                        vietnamese: vietStr, definition: vietStr,
                                        example: colMap.ex_en !== -1 ? String(row[colMap.ex_en] || '').trim() : '',
                                        exampleVi: colMap.ex_vi !== -1 ? String(row[colMap.ex_vi] || '').trim() : '',
                                        status: 'new', interval: 0, easeFactor: 2.5, dueAt: Date.now(), lapseCount: 0, reviewCount: 0
                                    });
                                    idCounter++;
                                });
                                deckCounter++;
                            }
                        });

                        if (allParsedTerms.length > 0) {
                            setTerms(allParsedTerms); setDecks(parsedDecks); saveToStorage(allParsedTerms, parsedDecks);
                            showAlert(`Thành công! Đã nạp ${allParsedTerms.length} thuật ngữ và tạo ${parsedDecks.length} bộ thẻ.`);
                        } else { showAlert("Không tìm thấy dữ liệu hợp lệ trong file Excel."); }
                    } catch (error) { showAlert("Lỗi đọc file Excel: " + error.message); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; 
            };

            const handleCreateDeck = (e) => {
                e.preventDefault();
                if (!newDeck.title.trim()) { showAlert("Tên bộ từ là bắt buộc."); return; }
                const id = 'DECK_' + Date.now();
                const d = { id, title: newDeck.title.trim(), topic: newDeck.topic.trim(), description: newDeck.description.trim(), count: 0 };
                const nextDecks = [...decks, d];
                setDecks(nextDecks); saveToStorage(terms, nextDecks);
                setNewDeck({ title: '', topic: '', description: '' }); setActiveTab('decks');
            };

            const handleDeleteDeck = (deckId) => {
                showConfirm("Xóa bộ từ này và toàn bộ từ vựng bên trong?", () => {
                    const nextDecks = decks.filter(d => d.id !== deckId);
                    const nextTerms = terms.filter(t => t.deckId !== deckId);
                    setDecks(nextDecks); setTerms(nextTerms);
                    saveToStorage(nextTerms, nextDecks); setActiveTab('decks');
                });
            };

            const handleSaveTerm = (termData, keepFormOpen) => {
                if (!termData.term.trim() || !termData.vietnamese.trim()) { showAlert('Thiếu thuật ngữ hoặc nghĩa tiếng Việt.'); return; }
                let nextTerms;
                if (termData.id) {
                    nextTerms = terms.map(t => t.id === termData.id ? {...t, ...termData} : t);
                } else {
                    const newId = 'MED' + Date.now() + Math.floor(Math.random()*1000);
                    const newItem = { ...termData, id: newId, status: 'new', interval: 0, easeFactor: 2.5, dueAt: Date.now(), reviewCount: 0, lapseCount: 0 };
                    nextTerms = [...terms, newItem];
                }
                const deckCount = nextTerms.filter(t => t.deckId === termData.deckId).length;
                const nextDecks = decks.map(d => d.id === termData.deckId ? {...d, count: deckCount} : d);
                setTerms(nextTerms); setDecks(nextDecks); saveToStorage(nextTerms, nextDecks);
                
                if (!keepFormOpen) {
                    setEditTerm(null);
                    if (activeTab === 'addword') setActiveTab('deckDetail');
                } else {
                    setEditTerm({ deckId: termData.deckId, term: '', vietnamese: '', type: '', ipa: '', example: '', exampleVi: '', definition: '' });
                }
            };

            const handleDeleteTerm = (termId) => {
                showConfirm("Xóa từ vựng này khỏi bộ?", () => {
                    const tToDelete = terms.find(t => t.id === termId);
                    if(!tToDelete) return;
                    const nextTerms = terms.filter(t => t.id !== termId);
                    const deckCount = nextTerms.filter(t => t.deckId === tToDelete.deckId).length;
                    const nextDecks = decks.map(d => d.id === tToDelete.deckId ? {...d, count: deckCount} : d);
                    setTerms(nextTerms); setDecks(nextDecks); saveToStorage(nextTerms, nextDecks);
                });
            };

            const downloadExcelTemplate = () => {
                const ws = XLSX.utils.aoa_to_sheet([['term', 'ipa', 'type', 'vietnamese', 'definition', 'example', 'exampleVi']]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, "Medical_English_Template.xlsx");
            };

            const importExcelToDeck = (e, deckId) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        if (jsonData.length < 2) { showAlert("File trống hoặc định dạng sai."); return; }
                        
                        const headers = jsonData[0].map(h => String(h).trim().toLowerCase());
                        const hMap = { term: headers.indexOf('term'), ipa: headers.indexOf('ipa'), type: headers.indexOf('type'), vietnamese: headers.indexOf('vietnamese'), definition: headers.indexOf('definition'), example: headers.indexOf('example'), exampleVi: headers.indexOf('examplevi') };
                        
                        if (hMap.term === -1 || hMap.vietnamese === -1) { showAlert("Lỗi: Cần có cột 'term' và 'vietnamese'."); return; }
                        
                        let validCount = 0; let errorCount = 0; let newTerms = [...terms];

                        for(let i=1; i<jsonData.length; i++) {
                            const row = jsonData[i];
                            const tVal = String(row[hMap.term]||'').trim();
                            const vVal = String(row[hMap.vietnamese]||'').trim();
                            if(!tVal || !vVal) { errorCount++; continue; }
                            
                            const existingIdx = newTerms.findIndex(t => t.term.toLowerCase() === tVal.toLowerCase() && t.deckId === deckId);
                            const item = {
                                term: tVal, vietnamese: vVal,
                                ipa: hMap.ipa !== -1 ? String(row[hMap.ipa]||'').trim() : '',
                                type: hMap.type !== -1 ? String(row[hMap.type]||'').trim() : '',
                                definition: hMap.definition !== -1 ? String(row[hMap.definition]||'').trim() : '',
                                example: hMap.example !== -1 ? String(row[hMap.example]||'').trim() : '',
                                exampleVi: hMap.exampleVi !== -1 ? String(row[hMap.exampleVi]||'').trim() : '',
                                deckId: deckId,
                            };
                            
                            if (existingIdx >= 0) newTerms[existingIdx] = { ...newTerms[existingIdx], ...item };
                            else newTerms.push({ ...item, id: 'MED'+Date.now()+i, status: 'new', interval: 0, easeFactor: 2.5, dueAt: Date.now(), reviewCount: 0, lapseCount: 0 });
                            validCount++;
                        }
                        
                        const deckCount = newTerms.filter(t => t.deckId === deckId).length;
                        const nextDecks = decks.map(d => d.id === deckId ? {...d, count: deckCount} : d);
                        setTerms(newTerms); setDecks(nextDecks); saveToStorage(newTerms, nextDecks);
                        showAlert(`Nhập thành công: ${validCount} dòng. Lỗi: ${errorCount} dòng.`);
                    } catch(err) { showAlert("Lỗi file Excel: " + err.message); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            const handleRating = (action) => {
                const currentTerm = learningQueue[currentIndex];
                let nextTerms = [...terms];
                const tIdx = nextTerms.findIndex(t => t.id === currentTerm.id);
                if (tIdx === -1) return;
                
                let t = { ...nextTerms[tIdx] };
                const now = Date.now();
                
                if (action === 'back') {
                    if (currentIndex > 0) { setCurrentIndex(currentIndex - 1); setIsRevealed(false); }
                    return;
                }

                let movedForward = false;
                
                if (action === 'forgot') {
                    t.status = 'learning'; 
                    t.lapseCount = (t.lapseCount || 0) + 1; 
                    t.interval = 0; 
                    t.dueAt = now + 60000; 
                    t.lastReviewedAt = now;
                    setSessionStats(prev => ({...prev, forgot: prev.forgot + 1, studied: prev.studied + 1}));
                    movedForward = true;
                } else if (action === 'mastered') {
                    t.status = 'mastered'; 
                    t.reviewCount = (t.reviewCount || 0) + 1; 
                    t.interval = 5; 
                    t.dueAt = now + (5 * 24 * 60 * 60 * 1000); 
                    t.lastReviewedAt = now;
                    setSessionStats(prev => ({...prev, mastered: prev.mastered + 1, studied: prev.studied + 1}));
                    movedForward = true; 
                    setDailyCount(prev => prev + 1); 
                    markStudyDay();
                } else if (action === 'next') {
                    t.status = 'learning'; 
                    t.dueAt = now + (6 * 60 * 1000); 
                    movedForward = true;
                }
                
                nextTerms[tIdx] = t; setTerms(nextTerms); saveToStorage(nextTerms, null);

                if (movedForward) {
                    if (currentIndex < learningQueue.length - 1) { setCurrentIndex(currentIndex + 1); setIsRevealed(false); }
                    else { setShowSummary(true); }
                }
            };

            const startDeck = (deckId) => {
                const deckTerms = terms.filter(t => t.deckId === deckId);
                if (deckTerms.length === 0) { showAlert("Bộ từ trống."); return; }
                setActiveDeck(decks.find(d => d.id === deckId));
                setLearningQueue([...deckTerms].sort(() => Math.random() - 0.5));
                setCurrentIndex(0); setIsRevealed(false); setShowSummary(false);
                setSessionStats({ studied: 0, forgot: 0, mastered: 0 }); setActiveTab('learning');
            };

            const startQuickReview = () => {
                const now = Date.now();
                const reviewTerms = terms.filter(t => (t.status === 'learning' || t.status === 'mastered') && t.dueAt <= now);
                const sessionQueue = [...reviewTerms].sort(() => Math.random() - 0.5).slice(0, 30);
                
                if (sessionQueue.length === 0) { 
                    showAlert("Tuyệt vời! Bạn không còn từ nào đến hạn ôn trong hôm nay. Hãy học thêm từ mới trong mục Decks nhé."); 
                    return; 
                }
                setActiveDeck({ title: "SRS Review", topic: "Ôn tập", count: sessionQueue.length });
                setLearningQueue(sessionQueue); setCurrentIndex(0); setIsRevealed(false); setShowSummary(false);
                setSessionStats({ studied: 0, forgot: 0, mastered: 0 }); setActiveTab('learning');
            };

            const startCloze = () => {
                let eligible = terms.filter(t => t.example && String(t.example).trim().length > 0);
                if (clozeDeckId !== 'all') eligible = eligible.filter(t => t.deckId === clozeDeckId);
                if (clozeFilter === 'unmastered') eligible = eligible.filter(t => t.status !== 'mastered');
                
                if (!eligible.length) { showAlert('Không có câu ví dụ phù hợp bộ lọc.'); return; }
                
                setClozeQueue([...eligible].sort(() => Math.random() - 0.5));
                setClozeIndex(0); setClozeAnswer(''); setClozeChecked(false); setActiveTab('cloze_run');
            };

            const checkCloze = (isCorrect) => {
                const item = clozeQueue[clozeIndex];
                if (!isCorrect) {
                     const nextTerms = terms.map(t => t.id === item.id ? { ...t, status: 'learning', interval: 0, dueAt: Date.now(), lapseCount: (t.lapseCount||0)+1 } : t);
                     setTerms(nextTerms); saveToStorage(nextTerms, null);
                }
            };

            const generateQuizOptions = (correctItem, deckId) => {
                let pool = terms;
                let distractors = pool.filter(t => t.id !== correctItem.id);
                distractors = distractors.sort(() => Math.random() - 0.5).slice(0, 3);
                
                let opts = [correctItem, ...distractors].sort(() => Math.random() - 0.5);
                setQuizOptions(opts);
            };

            const startQuiz = () => {
                let eligible = terms.filter(t => t.example && String(t.example).trim().length > 0);
                if (quizDeckId !== 'all') eligible = eligible.filter(t => t.deckId === quizDeckId);
                
                if (eligible.length < 4) {
                    showAlert('Cần ít nhất 4 từ có câu ví dụ để tạo bài trắc nghiệm.');
                    return;
                }
                
                const shuffled = [...eligible].sort(() => Math.random() - 0.5);
                const queue = shuffled.slice(0, quizLimit);
                
                setQuizQueue(queue);
                setQuizIndex(0);
                setQuizCorrectCount(0);
                setQuizSelected(null);
                setShowQuizResult(false);
                setQuizTimeLeft(30);
                generateQuizOptions(queue[0], quizDeckId);

                if (quizIndex < quizQueue.length - 1) {

                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <button onClick={() => {setActiveTab('home'); setDashboardListView(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${activeTab === 'home' ? 'bg-primary-50/80 text-primary shadow-sm' : 'text-gray-600 hover:bg-gray-50/50'}`}><i className="fas fa-chart-pie w-5"></i> Dashboard</button>
                            <button onClick={() => setActiveTab('decks')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${(activeTab === 'decks' || activeTab === 'deckDetail' || activeTab === 'createDeck' || activeTab === 'addword') ? 'bg-primary-50/80 text-primary shadow-sm' : 'text-gray-600 hover:bg-gray-50/50'}`}><i className="fas fa-layer-group w-5"></i> Bộ Từ (Decks)</button>
                            <button onClick={() => setActiveTab('practice')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${(activeTab === 'practice' || activeTab === 'cloze' || activeTab === 'cloze_run' || activeTab === 'learning' || activeTab === 'quiz_setup' || activeTab === 'quiz_run') ? 'bg-purple-50/80 text-purple-600 shadow-sm' : 'text-gray-600 hover:bg-gray-50/50'}`}><i className="fas fa-dumbbell w-5"></i> Ôn Tập</button>
                            <button onClick={() => setActiveTab('search')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${activeTab === 'search' ? 'bg-primary-50/80 text-primary shadow-sm' : 'text-gray-600 hover:bg-gray-50/50'}`}><i className="fas fa-search w-5"></i> Tra từ điển</button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${activeTab === 'settings' ? 'bg-primary-50/80 text-primary shadow-sm' : 'text-gray-600 hover:bg-gray-50/50'}`}><i className="fas fa-cog w-5"></i> Cài Đặt</button>
                        </nav>
                    </div>

                    <div className="v3-main">
                        {activeTab === 'home' && renderDashboard()}
                        {activeTab === 'decks' && renderDecks()}
                        {activeTab === 'createDeck' && renderCreateDeck()}
                        {activeTab === 'deckDetail' && renderDeckDetail()}
                        {activeTab === 'addword' && renderAddWord()}
                        {activeTab === 'practice' && renderPracticeMenu()}
                        {activeTab === 'learning' && renderFlashcard()}
                        {activeTab === 'search' && renderSearch()}
                        {activeTab === 'settings' && renderSettings()}
                        {activeTab === 'cloze' && renderClozeSetup()}
                        {activeTab === 'cloze_run' && renderClozeRun()}
                        {activeTab === 'quiz_setup' && renderQuizSetup()}
                        {activeTab === 'quiz_run' && renderQuizRun()}
                    </div>

                    {!['learning', 'cloze_run', 'quiz_run'].includes(activeTab) && (
                        <div className="v3-bottom pb-safe z-40 border-t border-gray-200/50 shadow-[0_-8px_30px_rgba(0,0,0,0.04)]">
                            <button className={activeTab==='home'?'active':''} onClick={()=>{setActiveTab('home'); setDashboardListView(null);}}><i className="fas fa-home"></i><span>Home</span></button>
                            <button className={(activeTab==='decks' || activeTab==='deckDetail' || activeTab==='createDeck' || activeTab==='addword')?'active':''} onClick={()=>setActiveTab('decks')}><i className="fas fa-layer-group"></i><span>Decks</span></button>
                            <button className={(activeTab==='practice' || activeTab==='cloze' || activeTab==='quiz_setup')?'active':''} onClick={()=>setActiveTab('practice')}><i className="fas fa-dumbbell"></i><span>Ôn tập</span></button>
                            <button className={activeTab==='search'?'active':''} onClick={()=>setActiveTab('search')}><i className="fas fa-search"></i><span>Tra từ</span></button>
                            <button className={activeTab==='settings'?'active':''} onClick={()=>setActiveTab('settings')}><i className="fas fa-cog"></i><span>Cài đặt</span></button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
